# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "ai-interview-preparation-platform"

[api]
enabled = true
# Port to use for the API URL.
port = 54321
# Array of extra schemas to expose in the API. Use "," to separate multiple schemas.
schemas = ["public", "graphql_public"]
# Array of extra schemas to include in OpenAPI document.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure. Limits payload size for accidental or malicious requests.
max_rows = 1000

[db]
# Port to use for the local database URL.
port = 54322
# Port to use for the local database shadow URL.
shadow_port = 54320
# The database major version to use. This has to be the same as your remote database's. Run `SHOW server_version;` on the remote database to check.
major_version = 15

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54329
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54323
# External URL of the API. Used to allow CORS.
api_url = "http://127.0.0.1"
# External URL of GraphQL. Used to allow CORS.
graphql_url = "http://127.0.0.1"
# External URL of the database pooler.
pooler_url = "http://127.0.0.1"

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
[inbucket]
enabled = true
# Port to use for the email testing server web interface.
port = 54324
# Port to use for the email testing server SMTP interface.
smtp_port = 54325
# Port to use for the email testing server POP3 interface.
pop3_port = 54326

[storage]
enabled = true
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MB"

[storage.image_transformation]
enabled = true

[auth]
enabled = true
# The base URL of your website. Used as an allow-list for redirects and for constructing URLs used
# in emails.
site_url = "http://127.0.0.1:3000"
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
additional_redirect_urls = ["https://127.0.0.1:3000"]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604,800 (1 week).
jwt_expiry = 3600
# If disabled, the refresh token will never expire.
enable_refresh_token_rotation = true
# Allows refresh tokens to be reused after expiration, up to the specified interval in seconds.
# Requires enable_refresh_token_rotation = true.
refresh_token_reuse_interval = 10
# Allow/disallow new user signups to your project.
enable_signup = true
# Allow/disallow anonymous sign-ins to your project.
enable_anonymous_sign_ins = false
# Allow/disallow password sign-ins to your project.
enable_email_signup = true
# If enabled, users need to confirm their email address before signing in.
enable_email_autoconfirm = false
# Update the minimum password length requirement for your project.
minimum_password_length = 8

# Use a mock edge runtime for local development.
[edge_runtime]
enabled = true
# Policy that determines whether an Edge Function can execute depending on its verification status.
# Configure one of the supported policies: `Enforce`, `Permit`, `Audit`.
policy = "Permit"
inspector_port = 8083

[analytics]
enabled = false
# Port to use for the local vector data.
port = 54327
# Port to use for the local vector data API.
api_port = 54328
