name: Backend CI

on:
  push:
    branches:
      - backend
  pull_request:
    branches:
      - backend

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 1.226.4

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start

      - name: Wait for Supabase readiness
        run: |
          echo "Waiting for Supabase API to be ready..."
          timeout 60s bash -c 'until curl -s http://127.0.0.1:54321/auth/v1/health | grep -q "name"; do sleep 2; done' || (echo "Supabase readiness timeout" && exit 1)
          echo "Supabase is ready."

      - name: Verify and Generate test environment file
        run: |
          echo "Generating .env.test from Supabase..."
          npx supabase status -o env > .env.test

          # Verify required variables are present
          if ! grep -q "API_URL" .env.test; then
            echo "ERROR: API_URL not found in .env.test"
            cat .env.test
            exit 1
          fi
          echo "Test environment successfully generated."

      - name: Reset database from zero
        run: npm run db:reset

      - name: Verify generated database types
        run: npm run db:types:check || echo "Types out of sync"

      - name: Auto-commit database types if out of sync
        run: |
          supabase gen types typescript --local > src/persistence/database.types.ts
          if [ -n "$(git status --porcelain src/persistence/database.types.ts)" ]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add src/persistence/database.types.ts
            git commit -m "chore(types): auto-update generated database types [skip ci]"
            git push origin backend
          fi

      - name: Run database lint
        run: npm run db:lint

      - name: Run database pgTAP tests
        run: npm run db:test

      - name: Run Phase 2 real-environment tests
        run: npm run test:e2e:phase2

      - name: Run formatting check
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run OpenAPI freshness check
        run: npm run openapi:check

      - name: Run all application Jest tests
        run: npm run test

      - name: Run production build
        run: npm run build

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
